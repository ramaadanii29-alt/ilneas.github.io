<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Special Birthday Gift</title>
<style>
  /* ====================================================
     GANTI DATA DI SINI (lihat juga script.js di bagian bawah)
     ==================================================== */

  :root {
    --bg-top: #bcd8f7;
    --bg-bottom: #8fb8ea;
    --card-bg: #ffffff;
    --accent: #3b7ddb;
    --text-dark: #23395d;
    --text-soft: #5c7ba8;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    background: radial-gradient(circle at 20% 10%, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* pola titik-titik di background, seperti di video */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.5) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    pointer-events: none;
  }

  .phone-frame {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 48px 22px 40px;
    position: relative;
    z-index: 1;
  }

  /* ---------- LOADING SCREEN ---------- */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #16233f, #0d1730);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loading-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-text {
    color: #cfe0ff;
    letter-spacing: 10px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 40px;
  }

  .loading-text .dots::after {
    content: '...';
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  .buddies {
    display: flex;
    align-items: flex-end;
    gap: 26px;
    border-bottom: 3px solid #7a2e44;
    padding-bottom: 0;
  }

  .buddy {
    width: 46px;
    height: 78px;
    border-radius: 8px;
    border: 3px solid #7a2e44;
    position: relative;
    animation: bounce 0.9s ease-in-out infinite;
  }

  .buddy.pink { background: #f7b3c2; animation-delay: 0s; }
  .buddy.white { background: #fefefe; height: 96px; animation-delay: 0.15s; }

  .buddy::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: #7a2e44;
  }

  .buddy .eyes {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #7a2e44;
    font-weight: 700;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ---------- MAIN CONTENT ---------- */
  #main-content {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    text-align: center;
  }

  #main-content.show {
    opacity: 1;
    transform: translateY(0);
  }

  .headline {
    font-family: 'Brush Script MT', cursive;
    font-size: 44px;
    color: #ffffff;
    text-shadow: 0 3px 10px rgba(20, 50, 90, 0.35);
    margin: 0 0 6px;
  }

  .subline {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: 600;
    margin: 0 0 30px;
  }

  /* music player pill */
  .music-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 40px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    margin-bottom: 26px;
  }

  .music-info .song-title {
    font-weight: 700;
    color: var(--text-dark);
    font-size: 15px;
  }

  .music-info .song-artist {
    color: #476085;
    font-size: 12px;
  }

  .play-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* two gift cards */
  .cards-row {
    display: flex;
    gap: 16px;
  }

  .gift-card {
    flex: 1;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 22px;
    padding: 26px 12px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .gift-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.7);
  }

  .gift-card .icon-badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    font-size: 26px;
    box-shadow: 0 6px 14px rgba(20,50,90,0.12);
  }

  .gift-card .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-dark);
  }

  .hint {
    margin-top: 26px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    letter-spacing: 3px;
  }

  /* ---------- MODAL (letter / wishes) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 25, 50, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    z-index: 60;
  }

  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .modal-card {
    background: repeating-linear-gradient(
      white,
      white 27px,
      #dfe9fb 28px
    );
    border: 2px dashed #9db8e0;
    border-radius: 18px;
    max-width: 380px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 26px 22px 30px;
    position: relative;
    transform: scale(0.92);
    transition: transform 0.3s ease;
  }

  .modal-overlay.open .modal-card {
    transform: scale(1);
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 18px;
    color: #7c8db0;
    cursor: pointer;
  }

  .modal-title {
    font-family: 'Brush Script MT', cursive;
    font-size: 28px;
    color: var(--accent);
    margin: 6px 0 18px;
  }

  .modal-text {
    color: #37455e;
    font-size: 14.5px;
    line-height: 28px;
    white-space: pre-line;
    text-align: left;
  }

  @media (max-width: 380px) {
    .headline { font-size: 36px; }
  }
</style>
</head>
<body>

  <!-- ====== LOADING SCREEN ====== -->
  <div id="loading-screen">
    <div class="loading-text"><span class="dots">LOADING</span></div>
    <div class="buddies">
      <div class="buddy pink"><div class="eyes">&gt; &lt;</div></div>
      <div class="buddy white"><div class="eyes">&bull; &bull;</div></div>
    </div>
  </div>

  <!-- ====== MAIN CONTENT ====== -->
  <div class="phone-frame">
    <div id="main-content">
      <h1 class="headline">It's Your Day!</h1>
      <p class="subline" id="recipient-line">A SPECIAL GIFT FOR ...</p>

      <div class="music-card">
        <div class="music-info">
          <div class="song-title" id="song-title">Judul Lagu</div>
          <div class="song-artist" id="song-artist">Nama Penyanyi</div>
        </div>
        <button class="play-btn" id="play-btn" aria-label="Putar lagu">▶</button>
      </div>

      <div class="cards-row">
        <div class="gift-card" id="open-letter">
          <div class="icon-badge">✉️</div>
          <div class="label">BIRTHDAY LETTER</div>
        </div>
        <div class="gift-card" id="open-wishes">
          <div class="icon-badge">⭐</div>
          <div class="label">SPECIAL WISHES</div>
        </div>
      </div>

      <p class="hint">TAP THE CARDS TO OPEN</p>
    </div>
  </div>

  <!-- ====== MODAL: BIRTHDAY LETTER ====== -->
  <div class="modal-overlay" id="letter-modal">
    <div class="modal-card">
      <button class="modal-close" data-close>✕</button>
      <h2 class="modal-title">A Letter For You</h2>
      <div class="modal-text" id="letter-text">
Tulis surat ulang tahunmu di sini...
      </div>
    </div>
  </div>

  <!-- ====== MODAL: SPECIAL WISHES ====== -->
  <div class="modal-overlay" id="wishes-modal">
    <div class="modal-card">
      <button class="modal-close" data-close>✕</button>
      <h2 class="modal-title">My Wishes ✨</h2>
      <div class="modal-text" id="wishes-text">
Tulis harapan/doa ulang tahunmu di sini...
      </div>
    </div>
  </div>

  <audio id="bg-audio" loop>
    <!-- taruh file musikmu di folder yang sama lalu ganti "musik.mp3" -->
    <source src="musik.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
